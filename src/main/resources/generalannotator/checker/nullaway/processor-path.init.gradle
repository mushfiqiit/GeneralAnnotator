// Generated by GeneralAnnotator. Applied with --init-script to the NullAway checkout named by
// GA_CHECKER_HOME; it adds one task and changes nothing in the checkout's build files.
//
// The task builds the :nullaway jar from the current checkout and writes the processor path
// that NullAway's own buildWithNullAway task uses: the checkout's Error Prone dependencies
// (configuration errorproneExtended), the freshly built nullaway jar, and NullAway's runtime
// dependencies. Output lines are "<kind>=<absolute path>".
gradle.allprojects { p ->
    if (p.path == ':nullaway') {
        p.afterEvaluate {
            p.tasks.register('generalAnnotatorProcessorPath') {
                dependsOn p.tasks.named('jar')
                def out = p.providers.gradleProperty('generalAnnotator.output')
                def jarFile = p.tasks.named('jar').flatMap { it.archiveFile }
                def errorprone = p.configurations.named('errorproneExtended')
                def runtime = p.configurations.named('runtimeClasspath')
                doLast {
                    def lines = []
                    lines << "nullaway-version=" + (p.findProperty("VERSION_NAME") ?: p.version)
                    lines << "nullaway-jar=" + jarFile.get().asFile.absolutePath
                    errorprone.get().files.each { lines << "errorprone=" + it.absolutePath }
                    runtime.get().files.each { lines << "runtime=" + it.absolutePath }
                    new File(out.get()).setText(lines.join('\n') + '\n', 'UTF-8')
                }
            }
        }
    }
}
